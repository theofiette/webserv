# worker_connection

# root  
# index 
# client_body_max    <- values par defaut dans le code (if not specified in file)

events {
    worker_connections  1024;
}

server {

    sendfile        on;
	
    # keepalive_timeout  65; // Kevin gere pas ca, a voir si on le fait

	##########################################################################
	#ERROR PAGES#
	#############
	error_page /error/error.html
	error_page /error/error.html #error config
	error_page 404 /error_page/404_error.html
	error_page 404 /500_error.html 
	error_page 404 /error_page/404_error.html #error config (duplicate)
	error_page 405 /error_page/doesnt_exist.html #error config
	error_page 500 /error_page/500_error.html
	#########################################################################
	
	client_body_max 2048;
    listen       80, 86; #pas sur about multiple ports
    server_name  localhost;

    location / {
		methods GET POST DELETE; #att methods non implementee ou doublon
        root   html;
        index  index.html;
    }

	location /upload/1 {
		root html_2;
		index bite.html;
		autoindex on;     #si html_2/upload/bite.html existe pas, liste le contenu de html_2/upload/
	}

	# location /upload/ { #error config (duplicate)
	# 	root html_bite;
	# 	index bite.html;
	# 	return 
	# }

	location / {
		methods GET POST DELETE; #att methods non implementee ou doublon
        root   html;
        index  index.html;
    }

	location /html/a{
		return 301 index.html #relative path from root
	}
	location /html/b{
		return 301 index.html #relative path from root
	}


	# location /html/upload/ {
	# 	return 301 index.html #relative path from root
	# }

	location /nope2 {
		return 302 http://localhost:8080/index.html # absolute path
	}

	location /nope3 {
		return  # if no err code -> return 302 / if no path -> return default home
	}

	location /upload/image 
	{
	}
}
