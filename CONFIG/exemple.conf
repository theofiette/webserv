# check si multiple servers on same port ?
# verifier cgi en location
# init fonction avec master sockets

local {
    max_clients 1; server
}

global {

	server_listen			8080;
	server_name				localhost_gen;
	server_sendfile			on;
	server_clientbodymax	2048;
	server_error			html/errors/error.html; dedede
	# server_error			404 page; //TODO

	location_method			on;
	# location_method			DELETE	off; //TODO
	location_index			g_index.html;
	location_autoindex		on;

	redir_valid				off;
	redir_errorcode			301;
	redir_path				html/errors/error2.html;
}

server {
	error_page 0 html/errors/ErrorPage.html;
	location / {
		index	index.html;
		# error_page 404 404.html;
		return 303 success.html;
	}
}
