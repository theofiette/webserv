# check reverse traversal
# check si 0 servers ?
# verifier cgi en location
# init fonction avec master sockets

local {
    max_clients 1024; server
}

global {


}

global {

	server_listen			8282;
	server_sendfile			on;
	server_clientbodymax	2048;
	server_error			html/errors/error.html; dedede
	# server_error			404 page; //TODO

	location_method			on;
	# location_method			DELETE	off; //TODO
	location_root			html;
	location_index			index.html;
	location_autoindex		on;

	redir_valid				off;
	redir_errorcode			301;
	redir_path				html/errors/error2.html;
}


server {
	listen 8080;
	name 127.0.0.1;

	location / 
	{
		root html;
		index index.html;
		cgi .sh;
	}
}

