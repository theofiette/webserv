local {
	max_clients 1024;
}

global {
	location_cookie      off;
	location_method      on;
	location_root        html;
	location_index       index.html;
	location_autoindex   on;

	redir_valid          off;
	redir_errorcode      301;
	redir_path           /index.html;
}

server {
	listen 8080;
	name 127.0.0.1;

	client_body_max 500000;
	error_page html/errors/error.html;
	error_page 404 html/errors/404_error.html;
	error_page 403 html/errors/403_error.html;
	error_page 415 html/errors/415_error.html;
	error_page 500 html/errors/500_error.html;

	location / 
	{
		root html;
		index index.html;
		upload upload/pictures/;
		methods GET POST on DELETE off;
	}

	location /cgi 
	{
		root cgi;
		index my_cgi.py;
		cgi .py .sh .cgi .out;
		methods GET POST on DELETE off;
	}

	location /style 
	{
		root html/css/style;
		index style.css;
		cookie on;
		methods DELETE off;
	}

	location /theme 
	{
		root html/css/style/theme;
		index theme.css;
		cookie on;
		methods DELETE off;
	}

	location /font 
	{
		root html/css/style/font;
		index font.css;
		cookie on;
		methods DELETE off;
	}
}

server {
	listen 8080;
	name 127.0.0.2;

	client_body_max 200000;
	error_page html/errors/error.html;

	location / 
	{
		root html;
		index methods.html;
		methods GET on POST off DELETE off;
	}

	location /upload 
	{
		root html;
		upload upload/pictures/;
		methods POST on GET off DELETE off;
	}
}

server {
	listen 8081;
	name 127.0.0.3;

	client_body_max 300000;
	error_page html/errors/error.html;

	location / 
	{
		root html;
		index post.html;
		methods GET POST on DELETE off;
	}

	location /todelete 
	{
		root html;
		autoindex on;
		methods DELETE on;
	}
}
