local {
    max_clients 1024; server
}

global {
	location_cookie			off;
	location_method			on;
	location_root			html;
	location_index			index.html;
	location_autoindex		off;

	redir_valid				off;
	redir_errorcode			301;
	redir_path				html/errors/error2.html;
}

server {

	listen		8080;
	name 		127.0.0.1;

	client_body_max	500000;
	
	error_page		html/errors/error.html;
	error_page 404 html/errors/404_error.html;

	location /
	{
		methods	DELETE off;
		root html;
		index index.html;
		cgi .sh .py .out;
		upload upload/pictures/;
		return 302 index.html;
	}

	location /cgi
	{
		root scripts;
		index cgi.sh;
		cgi .sh;
	}

	location /todelete
	{
		root html;
		return 302 index.html;
		# autoindex on;
	}

	location /style {
		root html/css/style/;
		index style.css;
		cookie on;
		methods DELETE off;
	}

	location /theme {
		root html/css/style/theme;
		index theme.css;
		cookie on;
		methods DELETE off;
	}

	location /font {
		root html/css/style/font;
		index font.css;
		cookie on;
		methods DELETE off;
	}
}
