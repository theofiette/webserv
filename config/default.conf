local {
    max_clients 1024; server
}

global {
	location_cookie			off;
	location_method			on;
	location_root			html;
	location_index			index.html;
	location_autoindex		on;

	redir_valid				off;
	redir_errorcode			301;
	redir_path				html/errors/error2.html;
}

server {

	listen		8080;
	name 		127.0.0.1;

	sendfile		on;
	client_body_max	4096;
	
	error_page		html/errors/error.html;

	location / 
	{
		root html;
		index index.html;
		cgi .sh .py;

		return 302 index.html;
	}

	location /css/style
	{
		cookie	off;
		methods DELETE off;
		root	html;
		index	style.css;
		cgi		.sh .c;
	}

	location /css/style/theme
	{
		cookie	on;
		methods DELETE off;
		root html;
		index theme.css;
	}

	location /css/style/font
	{
		cookie	on;
		methods DELETE off;
		root html;
		index font.css;
	}
}
